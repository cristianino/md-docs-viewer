# Opción A: nginx como proxy de "mdocs serve" (VPS).
#   mdocs serve --host 127.0.0.1 --port 8080 --base-path /docs
server {
    listen 80;
    server_name docs.ejemplo.com;

    location /docs/ {
        proxy_pass http://127.0.0.1:8080;      # sin barra final: conserva /docs/
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;               # generar el PDF puede tardar
    }
}


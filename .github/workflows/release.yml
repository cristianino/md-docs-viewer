name: release

# Crea un release:
#   - al subir un tag:  git tag v1.0.0 && git push origin v1.0.0
#   - o a mano: Actions → release → Run workflow → versión (crea el tag sobre master)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (p. ej. v0.1.0-rc1)"
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: paquetes y GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: versión válida
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || {
            echo "::error::versión inválida: $VERSION (usa vX.Y.Z o vX.Y.Z-rc1)"; exit 1; }
      - name: empaquetar
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            scripts/package.sh "$VERSION" "${target%/*}" "${target#*/}" release
          done
          # skill para claude.ai: SKILL.md + binario linux/amd64
          go build -trimpath -ldflags "-s -w -X github.com/cristianino/mdocs/cmd/mdocs.Version=${VERSION#v}" -o "$RUNNER_TEMP/mdocs" .
          "$RUNNER_TEMP/mdocs" skill zip --with-binary -o "release/mdocs-skill_${VERSION#v}.zip"
          cd release && sha256sum * > checksums.txt && cat checksums.txt
      - name: publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease";; esac   # v1.0.0-rc1 → pre-release
          # con tag existente lo usa; desde "Run workflow" lo crea sobre este commit
          gh release create "$VERSION" release/* \
            --title "$VERSION" --generate-notes --target "$GITHUB_SHA" $pre

  image:
    name: imágenes en GHCR
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4      # arm64: el apt-get de la imagen completa
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: etiquetas
        id: tags
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mdocs"
          ver="${VERSION#v}"
          echo "full=$repo:$ver,$repo:latest" >> "$GITHUB_OUTPUT"
          echo "slim=$repo:$ver-slim,$repo:slim" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.tags.outputs.ver }}
          tags: ${{ steps.tags.outputs.full }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: slim
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.tags.outputs.ver }}
          tags: ${{ steps.tags.outputs.slim }}

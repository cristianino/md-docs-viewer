name: release

# Crea un release al subir un tag de versión:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: paquetes y GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: empaquetar
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            scripts/package.sh "$GITHUB_REF_NAME" "${target%/*}" "${target#*/}" release
          done
          cd release && sha256sum * > checksums.txt && cat checksums.txt
      - name: publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac   # v1.0.0-rc1 → pre-release
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $pre

  image:
    name: imágenes en GHCR
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # arm64: el apt-get de la imagen completa
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: etiquetas
        id: tags
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mdocs"
          ver="${GITHUB_REF_NAME#v}"
          echo "full=$repo:$ver,$repo:latest" >> "$GITHUB_OUTPUT"
          echo "slim=$repo:$ver-slim,$repo:slim" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.tags.outputs.ver }}
          tags: ${{ steps.tags.outputs.full }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.tags.outputs.ver }}
          tags: ${{ steps.tags.outputs.slim }}
